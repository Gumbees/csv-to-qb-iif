<div class="tab-content" id="config">
  <div class="config-section">
    <div class="config-header">
      <h3>QuickBooks Configuration</h3>
    </div>
    <form id="qbConfigForm">
      <div class="form-group">
        <label for="qbwc_username">QBWC Username</label>
        <input type="text" id="qbwc_username" name="qbwc_username">
      </div>
      <div class="form-group">
        <label for="qbwc_password">QBWC Password</label>
        <input type="password" id="qbwc_password" name="qbwc_password">
      </div>
      <div class="form-group">
        <label for="quickbooks_default_account">Default Account</label>
        <input type="text" id="quickbooks_default_account" name="quickbooks_default_account">
      </div>
      <button type="submit" class="btn">Save QB Configuration</button>
    </form>
  </div>
</div>
