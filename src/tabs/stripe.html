<div class="tab-content" id="stripe">
  <div class="config-section">
    <div class="config-header">
      <h3>Stripe API Configuration</h3>
    </div>
    <form id="stripeConfigForm">
      <div class="form-group">
        <label for="stripe_secret_key">Stripe Secret Key</label>
        <input type="password" id="stripe_secret_key" name="stripe_secret_key" placeholder="sk_live_...">
      </div>
      <div class="form-group">
        <label for="stripe_webhook_secret">Webhook Secret</label>
        <input type="password" id="stripe_webhook_secret" name="stripe_webhook_secret">
      </div>
      <div class="form-group">
        <label for="stripe_sync_enabled">Enable Stripe Sync</label>
        <select id="stripe_sync_enabled" name="stripe_sync_enabled">
          <option value="true">Enabled</option>
          <option value="false">Disabled</option>
        </select>
      </div>
      <div class="form-group">
        <label for="stripe_sync_interval">Sync Interval (minutes)</label>
        <input type="number" id="stripe_sync_interval" name="stripe_sync_interval" min="5" max="1440">
      </div>
      <div class="actions">
        <button type="submit" class="btn">Save Stripe Config</button>
        <button type="button" class="btn secondary" id="testStripe">Test Connection</button>
        <button type="button" class="btn primary" id="importCustomers">Import Customers</button>
        <button type="button" class="btn success" id="importTransactions">Import New Transactions</button>
        <button type="button" class="btn warning" id="importAllTransactions">Import ALL Transactions</button>
      </div>
      
      <!-- Progress Bar Containers -->
      <div id="customerProgress" class="progress-container" style="display: none;">
        <div class="progress-bar">
          <div class="progress-fill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="customerProgressText">Starting import...</div>
      </div>
      
      <div id="transactionProgress" class="progress-container" style="display: none;">
        <div class="progress-bar">
          <div class="progress-fill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="transactionProgressText">Starting import...</div>
      </div>
    </form>
  </div>
  
  <div class="config-section">
    <div class="config-header">
      <h3>Imported Stripe Customers</h3>
    </div>
    <div class="actions">
      <button type="button" class="btn info" id="refreshCustomers">Refresh List</button>
      <span id="customerStats" class="status info" style="margin-left: 10px;"></span>
    </div>
    <div id="stripeCustomersList">
      <table class="table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Created</th>
            <th>Last Sync</th>
          </tr>
        </thead>
        <tbody id="customersTable">
          <!-- Imported customers will be loaded here -->
        </tbody>
      </table>
    </div>
  </div>

  <div class="config-section">
    <div class="config-header">
      <h3>Imported Stripe Transactions</h3>
    </div>
    <div class="actions">
      <button type="button" class="btn info" id="refreshTransactions">Refresh List</button>
      <span id="transactionStats" class="status info" style="margin-left: 10px;"></span>
    </div>
    <div id="stripeTransactions">
      <table class="table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="transactionsTable">
          <!-- Imported transactions will be loaded here -->
        </tbody>
      </table>
    </div>
  </div>
</div>
